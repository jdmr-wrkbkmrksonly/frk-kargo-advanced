# This is a sample analysis template that uses the PokeAPI to
# check the base experience of a Pokemon is under threshold.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: pokemon-xp
  namespace: kargo-advanced
spec:
  args:
  - name: pokemon
  metrics:
  - name: pokemon-xp
    interval: 5s
    count: 5
    successCondition: result < 200
    failureLimit: 3
    provider:
      web:
        url: https://pokeapi.co/api/v2/pokemon/{{args.pokemon}}
        jsonPath: "{$.base_experience}"
---
# Runs a Locust.io load test as a Kubernetes Job against the freshly-deployed guestbook instance.
# The generic locustfile.py builds its tasks and SLOs entirely from config.yaml (mounted
# alongside it, same ConfigMap) -- see that file for the endpoint/threshold schema. enforceSlo
# (default "true") is a global escape hatch: set to "false" to make the whole run advisory-only
# regardless of what config.yaml says (per-endpoint `threshold: false` in config.yaml is the
# scoped equivalent, for exempting just one endpoint from gating).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: locust-perf-test
  namespace: kargo-advanced
spec:
  args:
  - name: host
  - name: users
  - name: spawnRate
  - name: runTime
  - name: enforceSlo
    value: "true"
  metrics:
  - name: locust-perf-test
    provider:
      job:
        spec:
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: locust
                image: locustio/locust:2.31.1
                command: ["sh", "-c"]
                args:
                - |
                  set -eu
                  pip install --quiet --disable-pip-version-check pyyaml
                  exec locust -f /locust/locustfile.py --headless \
                    --host="{{args.host}}" \
                    -u "{{args.users}}" \
                    -r "{{args.spawnRate}}" \
                    -t "{{args.runTime}}"
                env:
                - name: ENFORCE_SLO
                  value: "{{args.enforceSlo}}"
                volumeMounts:
                - name: locustfile
                  mountPath: /locust
              volumes:
              - name: locustfile
                configMap:
                  name: locust-perf-test-locustfile
---
# Fetches locustfile.py AND config.yaml from a private GitHub repo (raw.githubusercontent.com)
# via an init container, instead of the in-cluster ConfigMap locust-perf-test uses. Reuses the
# existing `github-creds` git Credentials Secret (created via `kargo create repo-credentials`)
# for the token — no new Secret needed.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: locust-perf-test-github
  namespace: kargo-advanced
spec:
  args:
  - name: host
  - name: users
  - name: spawnRate
  - name: runTime
  - name: enforceSlo
    value: "true"
  - name: githubRepo
    value: jdmr-wrkbkmrksonly/frk-kargo-advanced
  - name: githubRef
    value: main
  - name: githubPath
    value: env/perf-test/locustfile.py
  - name: githubConfigPath
    value: env/perf-test/config.yaml
  - name: githubTokenSecret
    value: github-creds
  metrics:
  - name: locust-perf-test-github
    provider:
      job:
        spec:
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              initContainers:
              - name: fetch-locustfile
                image: curlimages/curl:8.11.1
                env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: "{{args.githubTokenSecret}}"
                      key: password
                command:
                - sh
                - -c
                - |
                  set -eu
                  curl -sSfL \
                    -H "Authorization: token ${GITHUB_TOKEN}" \
                    "https://raw.githubusercontent.com/{{args.githubRepo}}/{{args.githubRef}}/{{args.githubPath}}" \
                    -o /locust/locustfile.py
                  curl -sSfL \
                    -H "Authorization: token ${GITHUB_TOKEN}" \
                    "https://raw.githubusercontent.com/{{args.githubRepo}}/{{args.githubRef}}/{{args.githubConfigPath}}" \
                    -o /locust/config.yaml
                volumeMounts:
                - name: locustfile
                  mountPath: /locust
              containers:
              - name: locust
                image: locustio/locust:2.31.1
                command: ["sh", "-c"]
                args:
                - |
                  set -eu
                  pip install --quiet --disable-pip-version-check pyyaml
                  exec locust -f /locust/locustfile.py --headless \
                    --host="{{args.host}}" \
                    -u "{{args.users}}" \
                    -r "{{args.spawnRate}}" \
                    -t "{{args.runTime}}"
                env:
                - name: ENFORCE_SLO
                  value: "{{args.enforceSlo}}"
                volumeMounts:
                - name: locustfile
                  mountPath: /locust
              volumes:
              - name: locustfile
                emptyDir: {}
---
# Fetches locustfile.py AND config.yaml from a private GCS bucket via an init container running
# gsutil, instead of the in-cluster ConfigMap locust-perf-test uses. Requires a Secret holding a
# GCP service-account JSON key — NOT committed here (never commit real key material). Create it
# yourself first:
#   kubectl create secret generic gcs-perf-test-sa-key \
#     --from-file=key.json=/path/to/your-service-account.json \
#     -n kargo-advanced
# The service account needs at least Storage Object Viewer on the bucket/objects below.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: locust-perf-test-gcs
  namespace: kargo-advanced
spec:
  args:
  - name: host
  - name: users
  - name: spawnRate
  - name: runTime
  - name: enforceSlo
    value: "true"
  - name: gcsObjectUrl
    value: gs://pplus-perf-test-bucket/perf-tests/locustfile.py
  - name: gcsConfigObjectUrl
    value: gs://pplus-perf-test-bucket/perf-tests/config.yaml
  - name: gcsCredentialsSecret
    value: gcs-perf-test-sa-key
  metrics:
  - name: locust-perf-test-gcs
    provider:
      job:
        spec:
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              initContainers:
              - name: fetch-locustfile
                image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
                env:
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /var/secrets/google/key.json
                command:
                - sh
                - -c
                - |
                  set -eu
                  gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
                  gsutil cp "{{args.gcsObjectUrl}}" /locust/locustfile.py
                  gsutil cp "{{args.gcsConfigObjectUrl}}" /locust/config.yaml
                volumeMounts:
                - name: gcs-key
                  mountPath: /var/secrets/google
                  readOnly: true
                - name: locustfile
                  mountPath: /locust
              containers:
              - name: locust
                image: locustio/locust:2.31.1
                command: ["sh", "-c"]
                args:
                - |
                  set -eu
                  pip install --quiet --disable-pip-version-check pyyaml
                  exec locust -f /locust/locustfile.py --headless \
                    --host="{{args.host}}" \
                    -u "{{args.users}}" \
                    -r "{{args.spawnRate}}" \
                    -t "{{args.runTime}}"
                env:
                - name: ENFORCE_SLO
                  value: "{{args.enforceSlo}}"
                volumeMounts:
                - name: locustfile
                  mountPath: /locust
              volumes:
              - name: gcs-key
                secret:
                  secretName: "{{args.gcsCredentialsSecret}}"
              - name: locustfile
                emptyDir: {}
